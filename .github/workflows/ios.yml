# The iOS app: the core package's tests on Linux, then an unsigned build on
# macOS packed as an .ipa for sideloading (AltStore, SideStore, Sideloadly
# re-sign it with the installer's own Apple ID). Builds from main replace the
# .ipa on the "ios" pre-release, so it keeps one download address; the
# website lists it in a SideStore/AltStore source (see pages.yml). Being a
# pre-release, it never counts as the latest Android release.
name: iOS

on:
  push:
    tags: ["v*-ios"]
    branches: ["main"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        working-directory: ios/OpenTuneCore
        run: |
          swift --version
          swift test

  app:
    runs-on: macos-15
    timeout-minutes: 45
    needs: core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            raw_tag="$GITHUB_REF_NAME"
            name=$(echo "${raw_tag#v}" | sed 's/-ios$//')
            tag="$raw_tag"
          else
            name="1.0.5"
            tag="v1.0.5-ios"
          fi
          code="5"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -version
          proj=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          if [ -z "$proj" ]; then
            echo "Error: No .xcodeproj found"
            exit 1
          fi
          echo "Found project: $proj"
          scheme=$(xcodebuild -list -project "$proj" | awk '/Schemes:/{flag=1;next} flag && NF {print $1; exit}')
          if [ -z "$scheme" ]; then
            scheme="OpenTune"
          fi
          echo "Using scheme: $scheme"
          xcodebuild \
            -project "$proj" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.code }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 && status=0 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log || true
          # A failed build still leaves a partial .app behind, so the result is what counts.
          if [ "$status" -ne 0 ] || ! grep -q "BUILD SUCCEEDED" build.log; then tail -n 80 build.log; exit 1; fi
          app_path=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$app_path" ]; then
            echo "Error: No .app found in build output"
            exit 1
          fi
          echo "Built app bundle at: $app_path"

      - name: Package .ipa
        id: ipa
        working-directory: ios
        run: |
          file="OpenBlast-v${{ steps.version.outputs.name }}-ios.ipa"
          mkdir -p Payload
          app_path=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -R "$app_path" Payload/
          zip -qry "$file" Payload
          cp "$file" OpenBlast-iOS.ipa
          ls -la "$file" OpenBlast-iOS.ipa
          echo "file=ios/$file" >> "$GITHUB_OUTPUT"
          echo "alias=ios/OpenBlast-iOS.ipa" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenBlast-iOS-v${{ steps.version.outputs.name }}
          path: |
            ${{ steps.ipa.outputs.file }}
            ${{ steps.ipa.outputs.alias }}

      - name: Publish for sideloading
        if: (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip deploy]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          title="OpenBlast v${{ steps.version.outputs.name }} (iOS Edition)"
          notes="Unsigned iOS IPA build for SideStore, AltStore, TrollStore or Sideloadly, built from ${GITHUB_SHA::7}. In SideStore or AltStore, add the source https://openblast.vercel.app/ios/source.json to install OpenBlast and get its updates on iPhone and iPad."
          if [ -f "docs/releases/${tag#v}.md" ]; then
            gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" "${{ steps.ipa.outputs.file }}" "${{ steps.ipa.outputs.alias }}" --target "$GITHUB_SHA" --title "$title" --notes-file "docs/releases/${tag#v}.md" --prerelease
            gh release upload "$tag" "${{ steps.ipa.outputs.file }}" "${{ steps.ipa.outputs.alias }}" --clobber
          else
            gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" "${{ steps.ipa.outputs.file }}" "${{ steps.ipa.outputs.alias }}" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --prerelease
            gh release upload "$tag" "${{ steps.ipa.outputs.file }}" "${{ steps.ipa.outputs.alias }}" --clobber
          fi
          # Also maintain the rolling 'ios' tag for permanent mirror compatibility
          if gh release view ios > /dev/null 2>&1; then
            gh release edit ios --title "$title" --notes "$notes" --prerelease
          else
            gh release create ios --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"
          fi
          gh release upload ios "${{ steps.ipa.outputs.alias }}" --clobber
