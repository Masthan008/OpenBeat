      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&display=swap"
    />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "@id": "https://openblast.vercel.app/#app",
      "name": "OpenBlast Web Player",
      "url": "https://openblast.vercel.app/",
      "description": "Stream music freely in your browser with OpenBlast Web Player. High-fidelity audio streaming, time-synced lyrics, playlists, offline caching, and real-time Listen Together rooms with zero ads.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "All modern web browsers",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Masthan Valli"
      },
      "contributor": [
        { "@type": "Person", "name": "Akshay", "jobTitle": "Tester & Promoter" },
        { "@type": "Person", "name": "Akhil", "jobTitle": "Tester & Promoter" },
        { "@type": "Person", "name": "Ganesh", "jobTitle": "Tester & Promoter" }
      ]
    }
    </script>
    <script>
      (function() {
        try {
          var p = window.location.pathname;
          var h = window.location.hash || '';
          var s = window.location.search || '';

          var codeInHash = h.match(/^#(?:code=)?([A-Za-z0-9-]{12,14})$/i);
          if (codeInHash && codeInHash[1]) {
            var c1 = codeInHash[1].replace(/-/g, '').toUpperCase();
            window.location.replace(window.location.origin + '/#/together/' + c1);
            return;
          }

          var qMatch = s.match(/[?&]code=([A-Za-z0-9-]{12,14})/i);
          if (qMatch && qMatch[1]) {
            var c2 = qMatch[1].replace(/-/g, '').toUpperCase();
            window.location.replace(window.location.origin + '/#/together/' + c2);
            return;
          }

          var pathMatch = p.match(/^\/(?:together|invite)\/([A-Za-z0-9-]{12,14})/i);
          if (pathMatch && pathMatch[1]) {
            var c3 = pathMatch[1].replace(/-/g, '').toUpperCase();
            window.location.replace(window.location.origin + '/#/together/' + c3);
            return;
          }

          if ((p.indexOf('/together') !== -1 || p.indexOf('/invite') !== -1) && h.indexOf('code=') !== -1) {
            var c4Match = h.match(/code=([A-Za-z0-9-]+)/i);
            if (c4Match && c4Match[1]) {
              var c4 = c4Match[1].replace(/-/g, '').toUpperCase();
              window.location.replace(window.location.origin + '/#/together/' + c4);
              return;
            }
          }

          if (p === '/together' || p === '/together/' || p === '/invite' || p === '/invite/') {
            window.location.replace(window.location.origin + '/#/together' + (h || s));
            return;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
